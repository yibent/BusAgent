name: 架构提案
description: 提议新的节点、协议或核心架构变化
title: "[Architecture]: "
labels:
  - architecture
body:
  - type: markdown
    attributes:
      value: 请描述具体场景、约束和可验证收益。核心协议变化通常需要 ADR。
  - type: textarea
    id: problem
    attributes:
      label: 问题与场景
      description: 当前设计在什么真实场景下不足？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明节点边界、消息流和关键决策。
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: 并发与可靠性语义
      description: 说明顺序、流式、背压、超时、重试、取消和部分失败。
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全与隐私影响
      description: 说明权限、数据、物理安全和人工确认边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验证指标
      description: 如何通过实验或测试证明建议有效？
    validations:
      required: true
